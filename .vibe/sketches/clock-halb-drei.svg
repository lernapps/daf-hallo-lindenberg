<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 160" role="img" aria-label="Sketch comparing German halb drei with 2:30 on a clock">
  <rect width="340" height="160" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="16" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Why "halb drei" = 14:30 (halfway TO 3)</text>
  <circle cx="85" cy="92" r="46" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <path d="M 85 92 L 85 46 A 46 46 0 0 1 85 138 Z" fill="#dbeafe"/>
  <line x1="85" y1="92" x2="112" y2="85" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  <line x1="85" y1="92" x2="85" y2="128" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round"/>
  <text x="85" y="59" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">12</text>
  <text x="121" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">3</text>
  <text x="85" y="133" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">6</text>
  <text x="49" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">9</text>
  <rect x="150" y="48" width="174" height="36" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="160" y="64" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">DE: halb drei = 14:30</text>
  <text x="160" y="78" font-family="system-ui, sans-serif" font-size="10" fill="#1e3a8a">30 min BEFORE 3:00</text>
  <rect x="150" y="94" width="174" height="44" rx="6" fill="#f1f5f9" stroke="#475569"/>
  <text x="160" y="112" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">um + time (um 14:30)</text>
  <text x="160" y="128" font-family="system-ui, sans-serif" font-size="11" fill="#0f172a">am + day · im + month</text>
</svg>
