<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 150" role="img" aria-label="Sketch of German greeting times at Lindenberg station">
  <rect width="340" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="16" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Arrival Folder · Greetings by Time of Day</text>
  <rect x="16" y="40" width="72" height="72" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="52" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#78350f">06–11</text>
  <text x="52" y="84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#78350f">Guten</text>
  <text x="52" y="99" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#78350f">Morgen</text>
  <rect x="96" y="40" width="72" height="72" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="132" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">11–18</text>
  <text x="132" y="84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1e3a8a">Guten</text>
  <text x="132" y="99" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">Tag</text>
  <rect x="176" y="40" width="72" height="72" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="212" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#4c1d95">18–22</text>
  <text x="212" y="84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#4c1d95">Guten</text>
  <text x="212" y="99" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#4c1d95">Abend</text>
  <rect x="256" y="40" width="68" height="72" rx="8" fill="#e2e8f0" stroke="#334155"/>
  <text x="290" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Sleep</text>
  <text x="290" y="84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#0f172a">Gute</text>
  <text x="290" y="99" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Nacht</text>
  <text x="16" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Informal anytime: Hallo! · Goodbye: Tschüss / Auf Wiedersehen</text>
</svg>
