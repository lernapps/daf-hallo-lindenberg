<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 190" role="img" aria-label="Analog clock showing 2:30 shaded toward 3:00 to explain German halb drei equals 14:30, plus time prepositions um for clock time, am for days, im for months">
  <rect width="340" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="16" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Arrival Folder · Clock &amp; Calendar</text>

  <circle cx="80" cy="100" r="48" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <path d="M 80 100 L 80 52 A 48 48 0 0 1 80 148 Z" fill="#dbeafe"/>
  <line x1="80" y1="100" x2="108" y2="92" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="80" y1="100" x2="80" y2="138" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="80" cy="100" r="3" fill="#0f172a"/>
  <text x="80" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0f172a">12</text>
  <text x="117" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0f172a">3</text>
  <text x="80" y="143" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0f172a">6</text>
  <text x="43" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0f172a">9</text>

  <rect x="144" y="42" width="180" height="48" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="154" y="61" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">halb = halfway TO next hour</text>
  <text x="154" y="79" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#1e3a8a">e.g. halb vier = 15:30 (not 16:30)</text>

  <rect x="144" y="98" width="180" height="58" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="154" y="116" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#78350f">um + clock time (um 8 Uhr)</text>
  <text x="154" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#78350f">am + day / date (am Montag)</text>
  <text x="154" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#78350f">im + month (im Oktober)</text>
</svg>
