<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 198" role="img" aria-label="Opening hours sign for Stadtbibliothek Lindenberg: Mo-Fr 10:00-18:00, Sa 09:00-13:00, So and Feiertage geschlossen">
  <rect width="340" height="198" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="16" y="14" width="308" height="32" rx="6" fill="#1e3a8a"/>
  <text x="170" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Stadtbibliothek Lindenberg · Öffnungszeiten</text>

  <rect x="16" y="56" width="308" height="30" rx="6" fill="#dcfce7" stroke="#15803d"/>
  <text x="28" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#14532d">Mo – Fr</text>
  <text x="115" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#14532d">10:00 – 18:00 Uhr</text>
  <text x="255" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#14532d">geöffnet</text>

  <rect x="16" y="92" width="308" height="30" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="28" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#78350f">Sa</text>
  <text x="115" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#78350f">09:00 – 13:00 Uhr</text>
  <text x="255" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#78350f">geöffnet</text>

  <rect x="16" y="128" width="308" height="30" rx="6" fill="#ffe4e6" stroke="#be123c"/>
  <text x="28" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#9f1239">So &amp; Feiertage</text>
  <text x="210" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#9f1239">geschlossen</text>

  <text x="16" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#1e293b">geöffnet = open · geschlossen = closed</text>
</svg>
