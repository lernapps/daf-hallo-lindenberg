<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 218" role="img" aria-label="German registration form layout showing Vorname, Nachname, Geburtsdatum DD.MM.YYYY, Strasse and Hausnummer, and 5-digit PLZ before Wohnort">
  <rect width="340" height="218" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="14" y="12" width="312" height="28" rx="6" fill="#1e3a8a"/>
  <text x="24" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Anmeldeformular · Sprachschule Lindenberg</text>

  <text x="18" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#334155">Vorname (First name)</text>
  <rect x="18" y="63" width="144" height="24" rx="4" fill="#ffffff" stroke="#94a3b8"/>
  <text x="26" y="79" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">Peter</text>

  <text x="174" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#334155">Nachname (Last name)</text>
  <rect x="174" y="63" width="148" height="24" rx="4" fill="#ffffff" stroke="#94a3b8"/>
  <text x="182" y="79" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">Taylor</text>

  <text x="18" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#334155">Geburtsdatum (DD.MM.YYYY)</text>
  <rect x="18" y="109" width="304" height="24" rx="4" fill="#fef3c7" stroke="#b45309"/>
  <text x="26" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#78350f">14.05.2011  (Day . Month . Year)</text>

  <text x="18" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#334155">Straße, Hausnummer · PLZ (5 digits), Wohnort</text>
  <rect x="18" y="155" width="166" height="24" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="26" y="171" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">Lindenstraße 12</text>
  <rect x="192" y="155" width="130" height="24" rx="4" fill="#dcfce7" stroke="#15803d"/>
  <text x="200" y="171" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#14532d">35037 Lindenberg</text>

  <text x="18" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#334155">Street first, then number · 5-digit PLZ before town</text>
</svg>
