<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 184" role="img" aria-label="German number order: 24 is spoken ones first then tens as vier und zwanzig; German prices use a comma such as 2,45 Euro">
  <rect width="340" height="184" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="16" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Arrival Folder · German Numbers &amp; Prices</text>

  <rect x="16" y="40" width="90" height="58" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="61" y="66" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">24</text>
  <text x="61" y="86" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1e3a8a">tens · ones</text>

  <text x="118" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#334155">→</text>

  <rect x="140" y="40" width="184" height="58" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="232" y="64" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#78350f">vier · und · zwanzig</text>
  <text x="232" y="84" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#78350f">ones (4) + und + tens (20)</text>

  <rect x="16" y="110" width="218" height="44" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="26" y="129" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#14532d">Price tag: 2,45 € (comma!)</text>
  <text x="26" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#14532d">Spoken: zwei Euro fünfundvierzig</text>
</svg>
