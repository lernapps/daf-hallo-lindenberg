<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 198" role="img" aria-label="Two zones for German you: green inner circle du for peers, kids, friends, family; blue outer zone Sie for teachers, unfamiliar adults, and staff">
  <rect width="340" height="198" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="16" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Arrival Folder · du vs. Sie in Germany</text>

  <rect x="16" y="38" width="148" height="118" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="90" y="59" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#14532d">du (informal)</text>
  <text x="26" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#14532d">• Friends &amp; classmates</text>
  <text x="26" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#14532d">• Children &amp; teens</text>
  <text x="26" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#14532d">• Family (Lukas, Mina)</text>
  <text x="26" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#14532d">First name: Hallo Lukas!</text>

  <rect x="176" y="38" width="148" height="118" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="250" y="59" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">Sie (formal, capital S)</text>
  <text x="186" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e3a8a">• Teachers (Herr Braun)</text>
  <text x="186" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e3a8a">• Unfamiliar adults</text>
  <text x="186" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e3a8a">• Shop &amp; station staff</text>
  <text x="186" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1e3a8a">Frau / Herr + last name</text>

  <text x="16" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#1e293b">Rule: Use Sie until an adult offers du.</text>
</svg>
