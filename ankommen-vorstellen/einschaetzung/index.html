<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../ankommen-vorstellen/">Ankommen, Begrüßen und Formulare</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 6 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="explainer-language-text"><p>Jetzt stellt sich Peters zukünftige Mitschülerin Nadia (12) vor. Schreibe beide Sätze auf Deutsch.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="explainer-language-text"><p>Wähle für jede Szene in Lindenberg die passende Anrede.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="explainer-language-text"><p>Wähle das passende Wort für jede Szene in Lindenberg.</p></div><div class="explainer-language-live" hidden></div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Wie schreibt man Peters Adresse in Lindenberg nach deutscher Regel richtig?</legend>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>Lindenstraße 12, 35037 Lindenberg</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>12 Lindenstraße, Lindenberg 35037</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>35037, 12 Lindenstraße</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Lindenstraße 12, 35037 Lindenberg</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>In Deutschland stehen erst Straße + Hausnummer, dann die 5-stellige PLZ + Ort.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>12 Lindenstraße, Lindenberg 35037</strong></p><p>Das ist die englische Reihenfolge (Hausnummer vorn, Postleitzahl hinten).</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>35037, 12 Lindenstraße</strong></p><p>Die PLZ steht immer direkt vor dem Ortsnamen, nicht vor der Straße.</p></li>
</ul>
<p class="question-explanation">Auf deutschen Formularen steht die Hausnummer hinter dem Straßennamen und die 5-stellige PLZ vor dem Wohnort.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="explainer-language-text"><p>Ergänze die fehlenden deutschen Feldnamen für das Formular.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="explainer-language-text"><p>Schreibe zwei kurze Vorstellungssätze für Mina (9, wohnt in Lindenberg).</p></div><div class="explainer-language-live" hidden></div></li>
</ol>
