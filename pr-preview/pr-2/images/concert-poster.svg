<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 206" role="img" aria-label="Illustrated school concert poster with music notes: Schulkonzert Gymnasium Lindenberg, Samstag 18. Oktober, Einlass 16:30, Beginn 17:00, Erwachsene 5,00 Euro, Kinder bis 14 Jahre 3,00 Euro">
  <rect width="340" height="206" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="14" y="14" width="312" height="42" rx="8" fill="#4c1d95"/>
  <circle cx="34" cy="40" r="4.5" fill="#fde047"/>
  <line x1="38" y1="40" x2="38" y2="23" stroke="#fde047" stroke-width="2"/>
  <line x1="38" y1="23" x2="46" y2="26" stroke="#fde047" stroke-width="2.5"/>
  <circle cx="304" cy="40" r="4.5" fill="#fde047"/>
  <line x1="308" y1="40" x2="308" y2="23" stroke="#fde047" stroke-width="2"/>
  <line x1="308" y1="23" x2="316" y2="26" stroke="#fde047" stroke-width="2.5"/>
  <text x="170" y="33" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Schulkonzert · Live!</text>
  <text x="170" y="49" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#ede9fe">Aula der Schule · Marktplatz 4</text>

  <rect x="14" y="66" width="150" height="44" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="24" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1e3a8a">Datum</text>
  <text x="24" y="101" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">Samstag, 18. Okt.</text>

  <rect x="176" y="66" width="150" height="44" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="186" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#78350f">Einlass: 16:30 Uhr</text>
  <text x="186" y="101" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#78350f">Beginn: 17:00 Uhr</text>

  <rect x="14" y="120" width="218" height="52" rx="6" fill="#dcfce7" stroke="#15803d"/>
  <text x="24" y="139" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#14532d">Eintritt Erwachsene: 5,00 €</text>
  <text x="24" y="159" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#14532d">Kinder (bis 14): 3,00 €</text>
